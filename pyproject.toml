[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lodestar-eval"
version = "0.1.0"
description = "A steering-native evaluation harness for sparse-autoencoder interpretability research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed El Yazid El Yaakoubi" }]
keywords = ["interpretability", "activation-steering", "sparse-autoencoder", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "anthropic>=0.49,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "tenacity>=9,<10",
  "tqdm>=4.68.3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "types-tqdm>=4.66,<5",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
lodestar = "lodestar.cli:app"

[project.urls]
Documentation = "https://github.com/mo-dev-x/lodestar#readme"
Issues = "https://github.com/mo-dev-x/lodestar/issues"

[tool.hatch.build.targets.wheel]
packages = ["lodestar"]

[tool.hatch.build.targets.sdist]
include = ["lodestar", "tests", "docs", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lodestar"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

# numpy's bundled stubs use PEP 695 `type` statements, which mypy refuses to
# parse while python_version is pinned below 3.12. The mismatch is between the
# stubs and the target version, not a typing gap in lodestar, so we skip
# following them rather than lower our own strictness.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
