<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Lodestar">
  <title>Lodestar</title>
  <style>
    .star { transform-origin: 32px 8px; animation: twinkle 6s ease-in-out infinite; }
    .halo { opacity: 0; transform-origin: 32px 8px; animation: halo 6s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 55%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.14) rotate(10deg); }
    }
    @keyframes halo {
      0%, 55%, 100% { opacity: 0; transform: scale(0.6); }
      25% { opacity: 0.22; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a68bd8" stop-opacity="1"/>
      <stop offset="1" stop-color="#a68bd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="56" y1="32" x2="60" y2="32" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="32" y2="60" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="4" y2="32" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M30,33 L32,47 L34,33 Z" fill="#9aa0a6"/>
  <path d="M29,31 L32,11 L35,31 Z" fill="#a68bd8"/>
  <circle cx="32" cy="32" r="3" fill="#a68bd8"/>
  <circle class="halo" cx="32" cy="8" r="9" fill="url(#glow)"/>
  <path class="star" d="M32,1 C34.45,5.55 34.45,5.55 39,8 C34.45,10.45 34.45,10.45 32,15 C29.55,10.45 29.55,10.45 25,8 C29.55,5.55 29.55,5.55 32,1 Z" fill="#a68bd8"/>
  <text x="78" y="44" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#e6edf3">Lodestar</text>
</svg>
